<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta Tags -->
    <title>Terminus</title>
    <meta name="title" content="Terminus" />
    <meta
      name="description"
      content="Race day on a trail: your course and plan as a scrolling story, with your live position, the margin on each cutoff, and followers who see where you are."
    />
    <meta
      name="keywords"
      content="trail running, ultra trail, race day, cutoff, checkpoints, live tracking, GPX, race plan"
    />
    <meta name="author" content="Terminus" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://terminus-beta.netlify.app/" />
    <meta property="og:title" content="Terminus" />
    <meta
      property="og:description"
      content="Race day on a trail: your course and plan as a scrolling story, with your live position and the margin on each cutoff."
    />
    <meta
      property="og:image"
      content="https://terminus-beta.netlify.app/og-image.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://terminus-beta.netlify.app/" />
    <meta property="twitter:title" content="Terminus" />
    <meta
      property="twitter:description"
      content="Race day on a trail: your course and plan as a scrolling story, with your live position and the margin on each cutoff."
    />
    <meta
      property="twitter:image"
      content="https://terminus-beta.netlify.app/og-image.png"
    />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile -->
    <meta
      name="viewport"
      content="initial-scale=1, viewport-fit=cover, width=device-width"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
